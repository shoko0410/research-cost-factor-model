[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qsf"
version = "0.1.0"
description = "Minimal scaffold for qsf package and CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
qsf = "qsf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["qsf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
